name: build the code

on:
  push:
    branches: [ "develop","main" ]
  pull_request:
    branches: [ "develop","main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          set -x
          sudo apt-get update 
          sudo apt-get install cmake openssl libssl-dev libxml2-dev libarchive-dev liblz4-dev  libjsoncpp-dev -y

      - name: Checkout eshelpers
        uses: actions/checkout@v4
        with:
          repository: rdkcentral/eshelpers
          path: eshelpers
          ref: develop

      - name: Checkout ralf-utils
        uses: actions/checkout@v4
        with:
          repository: rdkcentral/ralf-utils
          path: ralf-utils
          ref: v1.2.0
          lfs: 'false'
          fetch-depth: 2          

      - name: Cache ralf-utils build directory
        uses: actions/cache@v4
        with:
          path: ralf-utils/build
          key: ${{ runner.os }}-ralf-utils-build-${{ hashFiles('ralf-utils/CMakeLists.txt', 'ralf-utils/src/**', 'ralf-utils/include/**') }}
          restore-keys: |
            ${{ runner.os }}-ralf-utils-build-

      - name: Build ralf-utils
        run: |
          mkdir -p ralf-utils/build
          cd ralf-utils/build
          cmake ../ --install-prefix ${GITHUB_WORKSPACE}/install
          make
          make install

      - name: Cache main build directory
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-main-build-${{ hashFiles('CMakeLists.txt', 'src/**', 'include/**', 'app/**') }}
          restore-keys: |
            ${{ runner.os }}-main-build-

      - name: Build
        run: |
          mkdir -p build
          cd build
          cmake -DCMAKE_INCLUDE_PATH=/usr/include/jsoncpp/ -DCMAKE_INSTALL_INCLUDEDIR=. -DCMAKE_PREFIX_PATH=${GITHUB_WORKSPACE}/install -DCMAKE_CXX_STANDARD=17  -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS=" -g -std=c++17 -I${GITHUB_WORKSPACE}/eshelpers/packager -I${GITHUB_WORKSPACE}/install/include -L${GITHUB_WORKSPACE}/install/lib" ..
          make

